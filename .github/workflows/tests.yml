name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    # Ubuntu 26.04 runner images no longer provide setup-python 3.8 builds.
    # Pin a supported image so the project's documented minimum version is tested.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
